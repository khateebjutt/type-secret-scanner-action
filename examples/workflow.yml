name: Secret Scan

on:
  pull_request:
    branches: [main, master]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Secret Scanner
        uses: your-username/secret-scanner-action@v1
        with:
          scan-mode: diff
          fail-on-found: true
